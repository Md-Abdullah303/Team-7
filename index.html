<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team 7</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="img/team-logo.png" type="image/x-icon">
</head>

<body class="dark">  <!-- Default Dark Mode -->

    <!-- Dark Mode Button -->
    <div class="toggle-btn" onclick="toggleTheme()">Light Mode</div>

    <!-- Animated Background Shapes -->
    <ul class="floating-shapes">
        <li class="sq"></li>
        <li class="tri"></li>
        <li class="cir"></li>
        <li class="sq"></li>
        <li class="tri"></li>
        <li class="cir"></li>
    </ul>

    <header>
        <div class="logo">
            <img src="img/team7Logo.png" alt="team7 logo">
        </div>

        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="Leader/leaderHome.html">Leader</a></li>
            <li><a href="html/team.html">Team</a></li>
        </ul>
    </header>

    <main>
        <div class="contant">

            <div class="left-contant">
                <img src="img/team7Logo.png" alt="">
                <div class="box">
                    <p>Welcome To our website. Click start to go "HOME" Page</p>
                </div>
            </div>

            <div class="right-contant">
                <div class="start">
                    <a href="home.html">Start</a>
                </div>
            </div>

        </div>
    </main>

<script>
function toggleTheme() {
    document.body.classList.toggle("dark");

    const btn = document.querySelector(".toggle-btn");
    btn.textContent = document.body.classList.contains("dark")
        ? "Light Mode"
        : "Dark Mode";
}
</script>

</body>
</html>
